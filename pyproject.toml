[project]
name = "code-agent"
version = "0.1.0"
description = "A workspace-safe CLI code agent built with LangGraph tool calling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pywin32>=312; sys_platform == 'win32'",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
code-agent = "code_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
